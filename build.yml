name: Build NovaClient

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
